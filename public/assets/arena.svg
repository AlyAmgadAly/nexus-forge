<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="78%">
      <stop offset="0" stop-color="#172b37"/>
      <stop offset=".42" stop-color="#0b1b27"/>
      <stop offset=".76" stop-color="#050d16"/>
      <stop offset="1" stop-color="#020509"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#79c5bd" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#3d8f9c" stop-opacity=".1"/>
      <stop offset="1" stop-color="#102a36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4dd9c" stop-opacity=".24"/>
      <stop offset=".4" stop-color="#b78b3d" stop-opacity=".1"/>
      <stop offset="1" stop-color="#5f3c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16313a" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#1a3334" stop-opacity=".56"/>
      <stop offset="1" stop-color="#050b10" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03070c" stop-opacity=".95"/>
      <stop offset=".32" stop-color="#1d3a40" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#0b1d24" stop-opacity=".88"/>
      <stop offset="1" stop-color="#020407" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5a75e" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#f1df9e" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8f6d2e" stop-opacity=".34"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer>
    </filter>
    <pattern id="runeTicks" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(9)">
      <path d="M26 2v8M26 42v8M2 26h8M42 26h8" stroke="#e4cc87" stroke-opacity=".17" stroke-width="1"/>
      <circle cx="26" cy="26" r="2.2" fill="none" stroke="#e4cc87" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="960" cy="540" rx="720" ry="430" fill="url(#halo)"/>
  <ellipse cx="960" cy="600" rx="470" ry="220" fill="url(#goldGlow)" opacity=".7"/>

  <!-- distant fog banks -->
  <g opacity=".7" filter="url(#soft)">
    <ellipse cx="260" cy="482" rx="360" ry="80" fill="#295662" opacity=".23"/>
    <ellipse cx="1600" cy="520" rx="420" ry="100" fill="#2b5d66" opacity=".19"/>
    <ellipse cx="960" cy="418" rx="760" ry="120" fill="#1a3b4c" opacity=".24"/>
  </g>

  <!-- side colonnades -->
  <g opacity=".9">
    <path d="M0 0h210l-36 196-18 730H0z" fill="url(#pillar)"/>
    <path d="M1920 0h-210l36 196 18 730h156z" fill="url(#pillar)"/>
    <path d="M168 52l-8 910" stroke="#7b9aa0" stroke-opacity=".1" stroke-width="2"/>
    <path d="M1752 52l8 910" stroke="#7b9aa0" stroke-opacity=".1" stroke-width="2"/>
    <g fill="#c6a75c" opacity=".18">
      <path d="M98 76l12 34 34 12-34 12-12 34-12-34-34-12 34-12z"/>
      <path d="M1822 76l12 34 34 12-34 12-12 34-12-34-34-12 34-12z"/>
    </g>
    <path d="M112 196l-2 688M1808 196l2 688" stroke="url(#rail)" stroke-width="2"/>
  </g>

  <!-- arena floor -->
  <path d="M0 556C300 470 530 440 960 440s660 30 960 116v524H0z" fill="url(#floor)" opacity=".94"/>
  <path d="M0 560C330 492 540 456 960 456s630 36 960 104" fill="none" stroke="#e5cc84" stroke-opacity=".16" stroke-width="1.3"/>

  <!-- central ritual circles -->
  <g opacity=".72">
    <ellipse cx="960" cy="566" rx="560" ry="212" fill="none" stroke="#d9bd72" stroke-opacity=".15" stroke-width="1.2"/>
    <ellipse cx="960" cy="566" rx="452" ry="170" fill="none" stroke="#d9bd72" stroke-opacity=".13" stroke-width="1"/>
    <ellipse cx="960" cy="566" rx="320" ry="120" fill="none" stroke="#9bd4c9" stroke-opacity=".1" stroke-width="1"/>
    <ellipse cx="960" cy="566" rx="208" ry="78" fill="none" stroke="#d9bd72" stroke-opacity=".16" stroke-width="1"/>
    <ellipse cx="960" cy="566" rx="560" ry="212" fill="url(#runeTicks)" opacity=".34"/>
    <g fill="none" stroke="#e4cc87" stroke-opacity=".18" stroke-width="1">
      <path d="M960 352l22 44 48 8-36 34 10 48-44-24-44 24 10-48-36-34 48-8z"/>
      <path d="M960 704l17 34 38 7-29 26 8 38-34-18-34 18 8-38-29-26 38-7z" opacity=".7"/>
    </g>
    <g stroke="#d9bd72" stroke-opacity=".12" stroke-width="1">
      <path d="M400 566h1120M960 354v424" stroke-dasharray="2 12"/>
    </g>
  </g>

  <!-- center seam of the battlefield -->
  <g opacity=".85">
    <path d="M276 554C540 535 720 528 960 528s420 7 684 26" fill="none" stroke="#e8d293" stroke-opacity=".24" stroke-width="1.2"/>
    <path d="M276 558C540 539 720 532 960 532s420 7 684 26" fill="none" stroke="#63c3b7" stroke-opacity=".1" stroke-width="4" filter="url(#softSmall)"/>
    <path d="M780 530h360M960 490v80" stroke="#e8d293" stroke-opacity=".1"/>
    <circle cx="960" cy="530" r="5" fill="#e8d293" fill-opacity=".45"/>
  </g>

  <!-- side braziers -->
  <g>
    <ellipse cx="284" cy="648" rx="110" ry="30" fill="#5cc8bd" opacity=".07" filter="url(#soft)"/>
    <ellipse cx="1636" cy="648" rx="110" ry="30" fill="#e0b878" opacity=".06" filter="url(#soft)"/>
    <path d="M254 741h60l-8 74h-44z" fill="#0c171d" stroke="#c7a75e" stroke-opacity=".2"/>
    <path d="M1606 741h60l-8 74h-44z" fill="#0c171d" stroke="#c7a75e" stroke-opacity=".2"/>
    <g fill="#69d1c2" opacity=".34" filter="url(#softSmall)">
      <ellipse cx="284" cy="718" rx="26" ry="42"/>
    </g>
    <g fill="#f0c77d" opacity=".28" filter="url(#softSmall)">
      <ellipse cx="1636" cy="718" rx="26" ry="42"/>
    </g>
  </g>

  <!-- floating motes -->
  <g fill="#f4dfa2">
    <circle cx="380" cy="310" r="2" opacity=".35"/>
    <circle cx="1488" cy="270" r="1.5" opacity=".28"/>
    <circle cx="1250" cy="400" r="1.3" opacity=".22"/>
    <circle cx="612" cy="439" r="1.4" opacity=".25"/>
    <circle cx="1580" cy="612" r="2.2" opacity=".2"/>
    <circle cx="330" cy="584" r="1.7" opacity=".2"/>
  </g>

  <rect width="1920" height="1080" filter="url(#grain)" opacity=".55"/>

  <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#010309" stop-opacity=".9"/>
    <stop offset=".2" stop-color="#010309" stop-opacity=".1"/>
    <stop offset=".72" stop-color="#010309" stop-opacity=".02"/>
    <stop offset="1" stop-color="#010309" stop-opacity=".9"/>
  </linearGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <linearGradient id="sideVignette" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#010309" stop-opacity=".75"/>
    <stop offset=".2" stop-color="#010309" stop-opacity="0"/>
    <stop offset=".8" stop-color="#010309" stop-opacity="0"/>
    <stop offset="1" stop-color="#010309" stop-opacity=".75"/>
  </linearGradient>
  <rect width="1920" height="1080" fill="url(#sideVignette)"/>
</svg>
